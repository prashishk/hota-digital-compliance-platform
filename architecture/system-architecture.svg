<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f4f5f7"/><text x="70" y="65" font-family="Arial" font-size="28" font-weight="700" fill="#20242a">HOTA Compliance — system view</text><text x="70" y="94" font-family="Arial" font-size="14" fill="#737a84">Portfolio architecture · synthetic workflow · no production credentials or patient data</text><g font-family="Arial"><rect x="70" y="150" width="220" height="105" rx="10" fill="#fff" stroke="#d9dde2"/><text x="95" y="185" font-size="17" font-weight="700" fill="#20242a">Hospital user</text><text x="95" y="212" font-size="13" fill="#737a84">Registration</text><text x="95" y="233" font-size="13" fill="#737a84">Evidence submission</text><rect x="350" y="135" width="250" height="135" rx="10" fill="#fff" stroke="#d9dde2"/><text x="375" y="170" font-size="17" font-weight="700" fill="#20242a">Workflow layer</text><text x="375" y="198" font-size="13" fill="#737a84">Case state management</text><text x="375" y="219" font-size="13" fill="#737a84">Role-based actions</text><text x="375" y="240" font-size="13" fill="#737a84">Validation &amp; exceptions</text><rect x="660" y="135" width="220" height="135" rx="10" fill="#fff" stroke="#d9dde2"/><text x="685" y="170" font-size="17" font-weight="700" fill="#20242a">Review layer</text><text x="685" y="198" font-size="13" fill="#737a84">Specialist review</text><text x="685" y="219" font-size="13" fill="#737a84">Clarification</text><text x="685" y="240" font-size="13" fill="#737a84">Approval decision</text><rect x="940" y="150" width="190" height="105" rx="10" fill="#fff" stroke="#d9dde2"/><text x="965" y="185" font-size="17" font-weight="700" fill="#20242a">Audit</text><text x="965" y="212" font-size="13" fill="#737a84">Decision history</text><text x="965" y="233" font-size="13" fill="#737a84">Case trail</text><g stroke="#777" stroke-width="2" fill="none"><path d="M290 202H350"/><path d="M600 202H660"/><path d="M880 202H940"/></g><g font-family="Arial"><rect x="170" y="350" width="860" height="145" rx="10" fill="#fff" stroke="#d9dde2"/><text x="200" y="385" font-size="17" font-weight="700" fill="#20242a">Evidence &amp; data boundary</text><text x="200" y="415" font-size="13" fill="#737a84">Synthetic case records → evidence checklist → review outcome → audit event</text><text x="200" y="446" font-size="13" fill="#737a84">Production implementation would add authenticated identity, persistent storage,</text><text x="200" y="468" font-size="13" fill="#737a84">document storage, notifications, monitoring and policy-controlled access.</text></g><path d="M770 270V350" stroke="#777" stroke-width="2"/><path d="M460 270V350" stroke="#777" stroke-width="2"/></svg>